name: Pull Request

on:
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/docs-pr.yml'
      - '.github/workflows/docs-deploy.yml'
      - '.github/workflows/release.yml'
      - '*.md'

permissions:
  contents: read
  packages: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/beetlebugorg/go-dims:builder
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Trust the workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Generate the geometry parser
        run: go generate ./...

      - name: Check formatting
        run: |
          unformatted=$(git ls-files '*.go' | xargs gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "$unformatted"
            exit 1
          fi

      # The generated parser is excluded. ANTLR emits unreachable code.
      - name: Vet
        run: go list ./... | grep -v /internal/geometry/parser | xargs go vet

      - name: Test
        run: go test -race -count=1 ./...

      - name: Check the version is injected
        run: |
          make VERSION=version-probe
          test "$(./build/dims version)" = "version-probe"

      # A build arg only reaches make when the Dockerfile declares it. Both
      # image builds once took VERSION without declaring it, so every released
      # artifact carried the commit hash instead of the tag.
      - name: Check every image build declares VERSION
        run: |
          for file in Dockerfile Dockerfile.lambda Dockerfile.binaries; do
            grep -qE '^ARG VERSION' "$file" || {
              echo "$file takes a VERSION build arg but never declares it"
              exit 1
            }
          done

      - name: Scan for vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          "$(go env GOPATH)/bin/govulncheck" ./...

  build:
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - platform: linux/amd64
            os: ubuntu-24.04
          - platform: linux/arm64
            os: ubuntu-24.04-arm

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Container
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: go-dims:pr
          build-args: VERSION=pr-${{ github.event.pull_request.number }}
          platforms: ${{ matrix.platform }}

      - name: Check the version reaches the container
        run: |
          expected="pr-${{ github.event.pull_request.number }}"
          actual="$(docker run --rm go-dims:pr version)"
          test "$actual" = "$expected" || {
            echo "want $expected, got $actual"
            exit 1
          }

      - name: Build Lambda Function
        uses: docker/build-push-action@v5
        id: lambda
        with:
          context: .
          file: Dockerfile.lambda
          push: false
          build-args: VERSION=pr-${{ github.event.pull_request.number }}
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=build
