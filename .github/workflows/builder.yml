name: Builder Image

# Run by hand. The builder image carries the native libraries and the Go
# toolchain, so it only changes when Dockerfile.builder does.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish. Use something else to try a build without replacing the one in use.'
        required: true
        default: builder

permissions:
  contents: read

jobs:
  build:
    name: Build
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-24.04
            targetarch: amd64
          - platform: linux/arm64
            os: ubuntu-24.04-arm
            targetarch: arm64

    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each architecture builds on its own runner. Emulating arm64 here would
      # mean compiling libvips and its dependencies under QEMU.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.builder
          push: true
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/beetlebugorg/go-dims:${{ inputs.tag }}-${{ matrix.targetarch }}

  manifest:
    name: Push Manifest
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/beetlebugorg/go-dims:${{ inputs.tag }} \
            ghcr.io/beetlebugorg/go-dims:${{ inputs.tag }}-amd64 \
            ghcr.io/beetlebugorg/go-dims:${{ inputs.tag }}-arm64

      - name: Report
        run: |
          echo "Published ghcr.io/beetlebugorg/go-dims:${{ inputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect ghcr.io/beetlebugorg/go-dims:${{ inputs.tag }} >> "$GITHUB_STEP_SUMMARY"
