name: Release

on:
  push:
    paths-ignore:
      - 'docs/**'
      - '.github/workflows/docs-pr.yml'
      - '.github/workflows/docs-deploy.yml'
      - '*.md'
    tags:
      - v*

  # Run by hand to rebuild the published artifacts against a new builder
  # image, without cutting a version.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Moving tag to publish. latest and next are reserved for tagged releases.'
        required: true
        default: edge

env:
  # The moving tag this run publishes alongside the version. A tag carrying a
  # suffix, such as v1.0.0-rc1, is a candidate and takes next. Only a plain
  # version tag takes latest, so a pull of the bare image name stays on the
  # newest finished release.
  TRACKING_TAG: ${{ inputs.tag || (contains(github.ref_name, '-') && 'next' || 'latest') }}

permissions:
  contents: read

jobs:
  build:
    name: Build and Push
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        platform:
          - linux/amd64
          - linux/arm64
        include:
          - platform: linux/amd64
            os: ubuntu-24.04
            targetarch: amd64
          - platform: linux/arm64
            os: ubuntu-24.04-arm
            targetarch: arm64

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The version stamped into the binary. TRACKING_TAG names the channel a
      # build belongs to, such as latest or next, and says nothing about which
      # version it holds.
      - name: Compute the release version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Container
        uses: docker/build-push-action@v5
        id: container
        with:
          context: .
          push: true
          build-args: VERSION=${{ env.RELEASE_VERSION }}
          platforms: ${{ matrix.platform }}
          tags: ghcr.io/beetlebugorg/go-dims:${{ env.TRACKING_TAG }}-${{ matrix.targetarch }}

      - name: Build Lambda Function
        uses: docker/build-push-action@v5
        id: lambda
        with:
          context: .
          file: Dockerfile.lambda
          push: false
          build-args: VERSION=${{ env.RELEASE_VERSION }}
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=build

      - name: Upload Lambda zip
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: lambda-linux-${{ matrix.targetarch }}
          path: build/lambda-linux-${{ matrix.targetarch }}.zip

      - name: Build Standalone Binary
        uses: docker/build-push-action@v5
        id: binaries
        with:
          context: .
          file: Dockerfile.binaries
          push: false
          build-args: VERSION=${{ env.RELEASE_VERSION }}
          platforms: ${{ matrix.platform }}
          outputs: type=local,dest=build

      # The runner matches the target architecture, so the released binary
      # answers for itself.
      - name: Check the version reaches the binary
        run: |
          unzip -o -q build/dims-linux-${{ matrix.targetarch }}.zip -d /tmp/dims-release
          actual="$(/tmp/dims-release/dims version)"
          test "$actual" = "${{ env.RELEASE_VERSION }}" || {
            echo "want ${{ env.RELEASE_VERSION }}, got $actual"
            exit 1
          }

      - name: Upload Standalone Binary
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: dims-linux-${{ matrix.targetarch }}
          path: build/dims-linux-${{ matrix.targetarch }}.zip

  build-macos:
    name: Build macOS
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: arm64, os: macos-latest }
          - { arch: amd64, os: macos-15-intel }

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute the release version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "RELEASE_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "RELEASE_VERSION=$(git rev-parse --short=8 HEAD)" >> "$GITHUB_ENV"
          fi

      - name: Install libvips
        run: brew install vips

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # The same jar the builder image uses, so the generated parser matches
      # the one every other target is built from.
      - name: Install ANTLR
        run: |
          sudo mkdir -p /usr/local/lib
          sudo curl -fsSL -o /usr/local/lib/antlr.jar \
            https://www.antlr.org/download/antlr-4.13.2-complete.jar
          printf '#!/bin/sh\nexec java -jar /usr/local/lib/antlr.jar "$@"\n' \
            | sudo tee /usr/local/bin/antlr >/dev/null
          sudo chmod +x /usr/local/bin/antlr

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # make all links libvips dynamically. The static flags in make static are
      # for GNU ld and do not apply here, so the formula depends on vips.
      - name: Build
        run: make all VERSION="$RELEASE_VERSION"
        env:
          PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig

      - name: Check the version reaches the binary
        run: |
          actual="$(./build/dims version)"
          test "$actual" = "$RELEASE_VERSION" || {
            echo "want $RELEASE_VERSION, got $actual"
            exit 1
          }

      - name: Package
        run: |
          cp LICENSE NOTICE build/
          cd build && zip "dims-macos-${{ matrix.arch }}.zip" dims LICENSE NOTICE

      - name: Upload macOS Binary
        uses: actions/upload-artifact@v4
        with:
          retention-days: 1
          name: dims-macos-${{ matrix.arch }}
          path: build/dims-macos-${{ matrix.arch }}.zip

  manifest:
    name: Push Manifest
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute RELEASE_TAG
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            # Remove leading 'v' if present
            TAG="${GITHUB_REF_NAME#v}"
            echo "release_tag=${TAG}" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA=$(git rev-parse --short=8 HEAD)
            echo "release_tag=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/beetlebugorg/go-dims:${{ steps.tag.outputs.release_tag }} \
            -t ghcr.io/beetlebugorg/go-dims:${{ env.TRACKING_TAG }} \
            ghcr.io/beetlebugorg/go-dims:${{ env.TRACKING_TAG}}-amd64 \
            ghcr.io/beetlebugorg/go-dims:${{ env.TRACKING_TAG}}-arm64

  release:
    needs: [build, build-macos]
    name: Release
    if: ${{ startsWith(github.ref_name, 'v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create Release
        run: gh release create ${{ github.ref }} --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v4
        with:
          name: lambda-linux-arm64
          path: ./build

      - uses: actions/download-artifact@v4
        with:
          name: lambda-linux-amd64
          path: ./build

      - uses: actions/download-artifact@v4
        with:
          name: dims-linux-arm64
          path: ./build

      - uses: actions/download-artifact@v4
        with:
          name: dims-linux-amd64
          path: ./build

      - uses: actions/download-artifact@v4
        with:
          name: dims-macos-arm64
          path: ./build

      - uses: actions/download-artifact@v4
        with:
          name: dims-macos-amd64
          path: ./build

      - name: Upload to GitHub Release
        run: gh release upload "$TAG_NAME" ./build/lambda-*.zip ./build/dims-*.zip --repo "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}

  homebrew:
    name: Update the Homebrew tap
    needs: [release]
    # Every version tag updates the tap, a candidate included. A candidate
    # that skipped this job would leave the tap update unproven until the
    # release itself ran it.
    if: ${{ startsWith(github.ref_name, 'v') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Update the tap
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set, so the tap is unchanged"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          git clone --depth 1 \
            "https://x-access-token:$TAP_TOKEN@github.com/${{ github.repository_owner }}/homebrew-tap" tap
          mkdir -p tap/Formula
          scripts/brew-formula.sh "$version" dist > tap/Formula/go-dims.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/go-dims.rb
          git diff --cached --quiet || git commit -m "go-dims $version"
          git push
